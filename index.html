<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدارس التعلم ثنائي اللغة الأهلية</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --add-color: #27ae60;
            --search-color: #2980b9;
            --update-color: #f39c12;
            --delete-color: #e74c3c;
            --transfer-color: #8e44ad;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }
        
        /* تنسيق الهوية البصرية (اللوجو والعناوين) */
        .school-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }
        .school-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
            /* استبدل الرابط أدناه برابط شعار المدرسة الحقيقي */
            content: url('https://via.placeholder.com/100?text=Logo'); 
        }
        h1 { color: var(--primary-color); margin: 0 0 5px 0; font-size: 24px; }
        .location { color: var(--secondary-color); font-size: 14px; margin: 0 0 10px 0; font-weight: bold; }
        h2 { color: #7f8c8d; font-size: 16px; margin: 0; }
        
        /* تنسيق الأزرار العلوية */
        .buttons-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 13px;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        
        .btn-add { background-color: var(--add-color); }
        .btn-update { background-color: var(--update-color); }
        .btn-delete { background-color: var(--delete-color); }
        .btn-transfer { background-color: var(--transfer-color); }
        .btn-search-id { background-color: var(--search-color); }
        .btn-search-name { background-color: var(--search-color); }

        /* تنسيق الحقول */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width { grid-column: span 2; }
        .form-group { margin-bottom: 5px; }
        label { display: block; margin-bottom: 8px; color: var(--secondary-color); font-weight: 600; font-size: 14px; }
        label span { color: red; } 
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--search-color);
            box-shadow: 0 0 5px rgba(41, 128, 185, 0.3);
        }

        #fullClassName {
            background-color: #ecf0f1;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            cursor: default;
            border: 1px dashed #bdc3c7;
        }

        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success { background-color: #d4edda; color: #155724; display: block; }
        .error { background-color: #f8d7da; color: #721c24; display: block; }

        @media (max-width: 600px) {
            .form-grid, .buttons-container { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- الهوية البصرية -->
    <div class="school-header">
        <h1>مدارس التعلم ثنائي اللغة الأهلية</h1>

        <h2>نظام إدارة وتسكين الطلاب</h2>
    </div>

    <!-- الأزرار في الأعلى -->
    <div class="buttons-container">
        <button type="button" class="btn-add" onclick="addStudent()">إضافة طالب جديد</button>
        <button type="button" class="btn-update" onclick="updateStudent()">تحديث البيانات</button>
        <button type="button" class="btn-delete" onclick="deleteStudent()">حذف الطالب</button>
        <button type="button" class="btn-transfer" onclick="transferStudent()">نقل طالب</button>
        <button type="button" class="btn-search-id" onclick="searchStudent('id')">بحث برقم الهوية</button>
        <button type="button" class="btn-search-name" onclick="searchStudent('name')">بحث باسم الطالب</button>
    </div>

    <!-- الحقول (بدون أي تغيير في الأسماء) -->
    <div class="form-grid">
        <div class="form-group full-width">
            <label>اسم الطالب <span>*</span></label>
            <input type="text" id="studentName" placeholder="أدخل اسم الطالب الرباعي" required>
        </div>
        <div class="form-group">
            <label>رقم الهوية <span>*</span></label>
            <input type="number" id="nationalId" placeholder="أدخل رقم الهوية" required>
        </div>
        <div class="form-group">
            <label>القسم <span>*</span></label>
            <select id="section" required>
                <option value="">اختر القسم...</option>
                <option value="بنين">بنين</option>
                <option value="بنات">بنات</option>
            </select>
        </div>
        <div class="form-group">
            <label>المرحلة الدراسية <span>*</span></label>
            <select id="stage" required>
                <option value="">اختر المرحلة...</option>
                <option value="الابتدائية">المرحلة الابتدائية</option>
                <option value="المتوسطة">المرحلة المتوسطة</option>
                <option value="الثانوية">المرحلة الثانوية</option>
            </select>
        </div>
        <div class="form-group">
            <label>الصف <span>*</span></label>
            <select id="grade" required>
                <option value="">اختر المرحلة الدراسية أولاً...</option>
            </select>
        </div>
        <div class="form-group">
            <label>الفصل</label>
            <select id="classNumber"></select>
        </div>
        <div class="form-group">
            <label>المسار</label>
            <select id="track">
                <option value="عام">عام</option>
                <option value="تحفيظ">تحفيظ</option>
            </select>
        </div>
        <div class="form-group full-width">
            <label>اسم الصف كاملاً</label>
            <input type="text" id="fullClassName" readonly placeholder="سيظهر اسم الصف هنا تلقائياً..." tabindex="-1">
        </div>
    </div>

    <!-- رسائل النظام -->
    <div id="statusMessage" class="status-msg"></div>
</div>

<script>
    const N8N_WEBHOOK_URL = "https://your-n8n-instance.com/webhook/student-api";

    const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    function toArabicNumerals(num) {
        return String(num).replace(/[0-9]/g, w => arabicNumbers[+w]);
    }

    const stageSelect = document.getElementById('stage');
    const gradeSelect = document.getElementById('grade');
    const classNumberSelect = document.getElementById('classNumber');
    const trackSelect = document.getElementById('track');
    const fullClassNameInput = document.getElementById('fullClassName');

    for (let i = 1; i <= 10; i++) {
        const option = document.createElement('option');
        option.value = i; 
        option.textContent = toArabicNumerals(i); 
        classNumberSelect.appendChild(option);
    }

    stageSelect.addEventListener('change', function() {
        gradeSelect.innerHTML = '<option value="">اختر الصف...</option>';
        const stage = this.value;
        let maxGrade = 0;

        if (stage === 'الابتدائية') maxGrade = 6;
        else if (stage === 'المتوسطة' || stage === 'الثانوية') maxGrade = 3;

        const gradeNames = ['أول', 'ثاني', 'ثالث', 'رابع', 'خامس', 'سادس'];
        for (let i = 0; i < maxGrade; i++) {
            gradeSelect.innerHTML += `<option value="${i+1}">${gradeNames[i]}</option>`;
        }
        updateFullClassName();
    });

    function updateFullClassName() {
        if (gradeSelect.value && classNumberSelect.value && trackSelect.value) {
            const gradeText = gradeSelect.options[gradeSelect.selectedIndex].text;
            const classText = classNumberSelect.options[classNumberSelect.selectedIndex].text; 
            const trackText = trackSelect.options[trackSelect.selectedIndex].text;
            fullClassNameInput.value = `${gradeText} / ${classText} ${trackText}`;
        } else {
            fullClassNameInput.value = '';
        }
    }

    gradeSelect.addEventListener('change', updateFullClassName);
    classNumberSelect.addEventListener('change', updateFullClassName);
    trackSelect.addEventListener('change', updateFullClassName);

    function getFormData() {
        return {
            studentName: document.getElementById('studentName').value,
            nationalId: document.getElementById('nationalId').value,
            section: document.getElementById('section').value,
            stage: document.getElementById('stage').value,
            grade: document.getElementById('grade').value,
            classNumber: document.getElementById('classNumber').value,
            track: document.getElementById('track').value,
            fullClassName: document.getElementById('fullClassName').value 
        };
    }

    function showMessage(msg, isSuccess) {
        const msgDiv = document.getElementById('statusMessage');
        msgDiv.textContent = msg;
        msgDiv.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
        setTimeout(() => { msgDiv.style.display = 'none'; msgDiv.className = 'status-msg'; }, 5000);
    }

    // 1. الإضافة
    async function addStudent() {
        const data = getFormData();
        if(!data.studentName || !data.nationalId || !data.section || !data.stage || !data.grade) {
            showMessage("الرجاء تعبئة جميع الحقول الإلزامية!", false);
            return;
        }
        data.action = "add"; 
        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            showMessage("تمت الإضافة إلى النظام بنجاح!", true);
            document.querySelectorAll('input:not([readonly]), select').forEach(el => el.value = ''); 
            updateFullClassName();
        } catch (error) {
            showMessage("حدث خطأ أثناء الإضافة", false);
        }
    }

    // 2. البحث
    async function searchStudent(type) {
        const data = getFormData();
        const url = new URL(N8N_WEBHOOK_URL);
        
        if (type === 'id') {
            if(!data.nationalId) return showMessage("أدخل رقم الهوية للبحث", false);
            url.searchParams.append('action', 'searchID');
            url.searchParams.append('nationalId', data.nationalId);
        } else {
            if(!data.studentName) return showMessage("أدخل اسم الطالب للبحث", false);
            url.searchParams.append('action', 'searchName');
            url.searchParams.append('studentName', data.studentName);
        }

        try {
            const response = await fetch(url.toString(), { method: 'GET' });
            let result = await response.json(); 
            
            if (Array.isArray(result) && result.length > 0) result = result[0];

            if(result && result.studentName) {
                document.getElementById('studentName').value = result.studentName;
                document.getElementById('nationalId').value = result.nationalId;
                document.getElementById('section').value = result.section;
                document.getElementById('stage').value = result.stage;
                
                stageSelect.dispatchEvent(new Event('change'));
                document.getElementById('grade').value = result.grade;
                document.getElementById('classNumber').value = result.classNumber || '1';
                document.getElementById('track').value = result.track || 'عام';

                updateFullClassName();
                showMessage("تم العثور على بيانات الطالب", true);
            } else {
                showMessage("لم يتم العثور على الطالب", false);
            }
        } catch (error) {
            showMessage("حدث خطأ أثناء البحث، تأكد من إعدادات n8n", false);
        }
    }

    // 3. التحديث
    async function updateStudent() {
        const data = getFormData();
        if(!data.nationalId) return showMessage("رقم الهوية مطلوب للتحديث", false);
        data.action = "update";
        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            showMessage("تم تحديث بيانات الطالب بنجاح!", true);
        } catch (error) {
            showMessage("حدث خطأ أثناء التحديث", false);
        }
    }

    // 4. الحذف
    async function deleteStudent() {
        const nationalId = document.getElementById('nationalId').value;
        if(!nationalId) return showMessage("رقم الهوية مطلوب للحذف", false);
        if(!confirm("هل أنت متأكد من حذف بيانات هذا الطالب نهائياً؟")) return;
        
        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "delete", nationalId: nationalId }) 
            });
            showMessage("تم حذف بيانات الطالب بنجاح!", true);
            document.querySelectorAll('input:not([readonly]), select').forEach(el => el.value = '');
            updateFullClassName();
        } catch (error) {
            showMessage("حدث خطأ أثناء الحذف", false);
        }
    }

    // 5. نقل الطالب
    async function transferStudent() {
        const data = getFormData();
        if(!data.nationalId) return showMessage("رقم الهوية مطلوب لنقل الطالب", false);
        data.action = "transfer"; // يتم إرسال أمر transfer إلى n8n
        
        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data) 
            });
            showMessage("تم إرسال طلب نقل الطالب بنجاح!", true);
        } catch (error) {
            showMessage("حدث خطأ أثناء إرسال طلب النقل", false);
        }
    }
</script>
</body>
</html>
