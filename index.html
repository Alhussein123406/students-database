<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة شؤون الطلاب - مدارس التعلم ثنائي اللغة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f3460;
            --secondary-color: #e9a90a; 
            --bg-color: #f4f7f6;
            --surface-color: #ffffff;
            --text-main: #1f2937;
            --danger: #e63946;
            --success: #2a9d8f;
            --border: #d1d5db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        
        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            border-radius: 12px 12px 0 0;
            text-align: center;
            border-bottom: 5px solid var(--secondary-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .user-info {
            margin-top: 15px;
            font-size: 1rem;
            color: var(--secondary-color);
            font-weight: bold;
            display: none;
        }

        .admin-toggle {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
            background: var(--secondary-color);
            color: #fff;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            background: var(--surface-color);
            padding: 1rem;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-main);
            transition: 0.3s;
            flex: 1 1 calc(25% - 0.5rem);
            text-align: center;
        }

        .tab-btn:hover { background: #e5e7eb; }
        .tab-btn.active {
            background: var(--secondary-color);
            color: #fff;
            border-color: var(--secondary-color);
        }

        .form-section {
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: none;
            flex-direction: column;
            min-height: 450px;
        }
        .form-section.active { display: flex; }

        .form-content { flex-grow: 1; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: var(--primary-color); }
        .form-control {
            width: 100%;
            padding: 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f9fafb;
        }
        .form-control:focus { outline: none; border-color: var(--primary-color); background-color: #fff; box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1); }

        .row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; }

        .form-actions {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #1a4980; }
        .btn-secondary { background: var(--primary-color); color: white; }
        .btn-secondary:hover { background: #1a4980; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c52936; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #218377; }
        
        .search-result { background: #f0fdfa; padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem; display: none; border: 1px solid #ccfbf1; }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-error { background: #fee2e2; color: #991b1b; }

        @media (max-width: 768px) {
            .tab-btn { flex: 1 1 100%; }
            .form-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>مدارس التعلم ثنائي اللغة</h1>
        <p>نظام إدارة وتسكين الطلاب (قاعدة البيانات المركزية)</p>
        
        <div id="userInfo" class="user-info">
            👤 المستخدم الحالي: <span id="userNameDisplay"></span>
        </div>
        
        <button id="adminToggleBtn" class="admin-toggle" onclick="toggleAdminMode()">
            تفعيل صلاحيات المشرف
        </button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('add', event)">إضافة طالب</button>
        <button class="tab-btn" onclick="switchTab('edit', event)">تعديل / حذف</button>
        <button class="tab-btn" onclick="switchTab('transfer', event)">نقل طالب</button>
        <button class="tab-btn" onclick="switchTab('transfer-class', event)">ترحيل فصل كامل</button>
    </div>

    <div id="mainAlert" class="alert"></div>

    <!-- ================= 1. إضافة طالب ================= -->
    <div id="add" class="form-section active">
        <form id="addStudentForm" onsubmit="submitForm(event, 'add_student')" style="display: flex; flex-direction: column; height: 100%;">
            <div class="form-content">
                <div class="row">
                    <div class="form-group col">
                        <label>اسم الطالب الرباعي</label>
                        <input type="text" name="student_name" class="form-control" required>
                    </div>
                    <div class="form-group col">
                        <label>رقم الهوية</label>
                        <input type="number" name="national_id" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group col">
                        <label>المرحلة الدراسية</label>
                        <select name="stage" class="form-control" onchange="updateGradeOptions(this, 'grade')" required>
                            <option value="">اختر المرحلة...</option>
                            <option value="الابتدائية">المرحلة الابتدائية</option>
                            <option value="المتوسطة">المرحلة المتوسطة</option>
                            <option value="الثانوية">المرحلة الثانوية</option>
                        </select>
                    </div>
                    <div class="form-group col">
                        <label>القسم (بنين / بنات)</label>
                        <select name="gender" class="form-control" required>
                            <option value="">اختر القسم...</option>
                            <option value="بنين">بنين</option>
                            <option value="بنات">بنات</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>تسكين الطالب في الفصل</label>
                    <div class="row">
                        <select name="grade" class="form-control col" required>
                            <option value="">الصف</option>
                        </select>
                        <select name="section" class="form-control col" required>
                            <option value="">الرقم</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                        <select name="track" class="form-control col" required>
                            <option value="">المسار</option>
                            <option value="عام">عام</option>
                            <option value="تحفيظ">تحفيظ</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">حفظ وتسجيل الطالب</button>
            </div>
        </form>
    </div>

    <!-- ================= 2 & 3. بحث، تعديل، وحذف ================= -->
    <div id="edit" class="form-section">
        <div class="form-content">
            <form id="searchForm" onsubmit="searchStudent(event)">
                <div class="form-group">
                    <label>ابحث برقم الهوية أو اسم الطالب</label>
                    <div class="row" style="gap: 0;">
                        <input type="text" id="searchQuery" class="form-control" placeholder="أدخل رقم الهوية أو الاسم..." style="border-radius: 0 8px 8px 0;" required>
                        <button type="submit" class="btn btn-secondary" style="border-radius: 8px 0 0 8px; flex: 0.3;">بحث</button>
                    </div>
                </div>
            </form>

            <div id="searchResultArea" class="search-result">
                <h3 style="color: var(--primary-color); margin-bottom: 1rem;">بيانات الطالب المسترجعة</h3>
                <form id="editStudentForm" onsubmit="submitForm(event, 'update_student')">
                    <input type="hidden" name="original_id" id="edit_original_id">
                    <input type="hidden" name="target_table" value="students">
                    <div class="row">
                        <div class="form-group col">
                            <label>الاسم</label>
                            <input type="text" name="student_name" id="edit_name" class="form-control" required>
                        </div>
                        <div class="form-group col">
                            <label>رقم الهوية</label>
                            <input type="number" name="national_id" id="edit_id" class="form-control" required>
                        </div>
                        <div class="form-group col">
                            <label>القسم (بنين / بنات)</label>
                            <select name="gender" id="edit_gender" class="form-control" required>
                                <option value="">اختر القسم...</option>
                                <option value="بنين">بنين</option>
                                <option value="بنات">بنات</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">حفظ التعديلات</button>
                        <button type="button" class="btn btn-danger" onclick="deleteStudent()">حذف الطالب نهائياً</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= 4. نقل طالب من فصل لفصل ================= -->
    <div id="transfer" class="form-section">
        <form id="transferStudentForm" onsubmit="submitForm(event, 'transfer_student')" style="display: flex; flex-direction: column; height: 100%;">
            <div class="form-content">
                <div class="form-group">
                    <label>رقم هوية الطالب المراد نقله</label>
                    <input type="number" name="national_id" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label>المرحلة الجديدة المستهدفة</label>
                    <select name="new_stage" class="form-control" onchange="updateGradeOptions(this, 'new_grade')" required>
                        <option value="">اختر المرحلة...</option>
                        <option value="الابتدائية">المرحلة الابتدائية</option>
                        <option value="المتوسطة">المرحلة المتوسطة</option>
                        <option value="الثانوية">المرحلة الثانوية</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الفصل الجديد المستهدف</label>
                    <div class="row">
                        <select name="new_grade" class="form-control col" required>
                            <option value="">الصف</option>
                        </select>
                        <select name="new_section" class="form-control col" required>
                            <option value="">الرقم</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                        <select name="new_track" class="form-control col" required>
                            <option value="">المسار</option>
                            <option value="عام">عام</option>
                            <option value="تحفيظ">تحفيظ</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">تأكيد نقل الطالب</button>
            </div>
        </form>
    </div>

    <!-- ================= 5. ترحيل/نقل فصل كامل ================= -->
    <div id="transfer-class" class="form-section">
        <form id="transferClassForm" onsubmit="submitForm(event, 'transfer_class')" style="display: flex; flex-direction: column; height: 100%;">
            <div class="form-content">
                <!-- الفصل الحالي المراد ترحيله -->
                <div class="form-group">
                    <label>المرحلة الحالية (القديمة)</label>
                    <select name="old_stage" class="form-control" onchange="updateGradeOptions(this, 'old_grade')" required>
                        <option value="">اختر المرحلة الحالية...</option>
                        <option value="الابتدائية">المرحلة الابتدائية</option>
                        <option value="المتوسطة">المرحلة المتوسطة</option>
                        <option value="الثانوية">المرحلة الثانوية</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>اسم الفصل الحالي (القديم)</label>
                    <div class="row">
                        <select name="old_grade" class="form-control col" required>
                            <option value="">الصف</option>
                        </select>
                        <select name="old_section" class="form-control col" required>
                            <option value="">الرقم</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                        <select name="old_track" class="form-control col" required>
                            <option value="">المسار</option>
                            <option value="عام">عام</option>
                            <option value="تحفيظ">تحفيظ</option>
                        </select>
                    </div>
                </div>

                <hr style="margin: 2rem 0; border: 0; border-top: 1px dashed var(--border);">
                
                <!-- الفصل الجديد المستهدف -->
                <div class="form-group">
                    <label>المرحلة المستهدفة الجديدة</label>
                    <select name="target_stage" class="form-control" onchange="updateGradeOptions(this, 'target_grade')" required>
                        <option value="">اختر المرحلة المستهدفة...</option>
                        <option value="الابتدائية">المرحلة الابتدائية</option>
                        <option value="المتوسطة">المرحلة المتوسطة</option>
                        <option value="الثانوية">المرحلة الثانوية</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الفصل الجديد (المستهدف)</label>
                    <div class="row">
                        <select name="target_grade" class="form-control col" required>
                            <option value="">الصف</option>
                        </select>
                        <select name="target_section" class="form-control col" required>
                            <option value="">الرقم</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                            <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                        <select name="target_track" class="form-control col" required>
                            <option value="">المسار</option>
                            <option value="عام">عام</option>
                            <option value="تحفيظ">تحفيظ</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-secondary">ترحيل جميع طلاب الفصل</button>
            </div>
        </form>
    </div>

</div>

<script>
    const WEBHOOK_URL = 'http://localhost:5678/webhook-test/bcdf3a0a-caa3-4259-8936-6cbf40b75699';
    
    let adminToken = sessionStorage.getItem('adminToken') || null;
    let userToken = sessionStorage.getItem('userToken') || null;
    let userName = sessionStorage.getItem('userName') || null;

    document.addEventListener("DOMContentLoaded", () => {
        updateUI();
    });

    function updateUI() {
        const btn = document.getElementById('adminToggleBtn');
        const userInfo = document.getElementById('userInfo');
        const nameDisplay = document.getElementById('userNameDisplay');

        if (userName) {
            nameDisplay.innerText = userName;
            userInfo.style.display = 'block';
        } else {
            userInfo.style.display = 'none';
        }

        if (adminToken) {
            btn.innerText = 'إلغاء وضع الإدارة (مُفعل ✓)';
            btn.style.background = 'var(--danger)';
            btn.style.color = '#fff';
            btn.style.borderColor = '#fff';
        } else {
            btn.innerText = 'تفعيل صلاحيات المشرف';
            btn.style.background = 'var(--secondary-color)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'transparent';
        }
    }

    function ensureUserName() {
        if (!userName) {
            const name = prompt('الرجاء إدخال اسمك (أو الرقم الوظيفي) لتوثيق العمليات:');
            if (!name) return false;
            userName = name;
            sessionStorage.setItem('userName', name);
            updateUI();
        }
        return true;
    }

    function toggleAdminMode() {
        if (adminToken) {
            adminToken = null;
            sessionStorage.removeItem('adminToken');
            showAlert('تم إلغاء صلاحيات المشرف', 'success');
        } else {
            if (!ensureUserName()) return;
            const pass = prompt('الرجاء إدخال الرقم السري الخاص بالمشرف (لإتاحة الإضافة والحذف):');
            if (pass) {
                adminToken = pass;
                sessionStorage.setItem('adminToken', pass);
                showAlert('تم تفعيل وضع المشرف بنجاح', 'success');
            }
        }
        updateUI();
    }

    const gradesMap = {
        "الابتدائية": ["أول", "ثاني", "ثالث", "رابع", "خامس", "سادس"],
        "المتوسطة": ["أول", "ثاني", "ثالث"],
        "الثانوية": ["أول", "ثاني", "ثالث"]
    };

    function updateGradeOptions(stageSelectElement, gradeSelectName) {
        const stage = stageSelectElement.value;
        const form = stageSelectElement.closest('form');
        const gradeSelect = form.querySelector(`select[name="${gradeSelectName}"]`);
        
        gradeSelect.innerHTML = '<option value="">الصف</option>';
        
        if (stage && gradesMap[stage]) {
            gradesMap[stage].forEach(grade => {
                const opt = document.createElement('option');
                opt.value = grade;
                opt.textContent = grade;
                gradeSelect.appendChild(opt);
            });
        }
    }

    function switchTab(tabId, event) {
        document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
        hideAlert();
    }

    async function sendRequestToN8n(payload) {
        if (!userToken && !adminToken) {
            if (!ensureUserName()) return null;
            const pass = prompt('النظام محمي. الرجاء إدخال كلمة مرور الدخول للنظام:');
            if (!pass) return null;
            userToken = pass;
            sessionStorage.setItem('userToken', pass);
            updateUI();
        }

        if (!payload.data) payload.data = {};
        if (userToken) payload.data.user_password = userToken;
        if (adminToken) payload.data.admin_password = adminToken;
        if (userName) payload.data.user_name = userName;

        if (!WEBHOOK_URL || WEBHOOK_URL.trim() === '' || WEBHOOK_URL.includes('YOUR_N8N')) {
            await new Promise(resolve => setTimeout(resolve, 600));
            
            if (payload.action === 'search_student') {
                return {
                    id: payload.data.query,
                    name: "طالب تجريبي (محمد أحمد)",
                    gender: "بنين",
                    target_table: "students"
                };
            }
            return { success: true };
        }

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (response.ok) {
                const data = await response.json();
                
                if (data.error) {
                    showAlert(data.error, 'error');
                    if (data.error.includes('المشرف')) {
                        sessionStorage.removeItem('adminToken');
                        adminToken = null;
                    } else {
                        sessionStorage.removeItem('userToken');
                        sessionStorage.removeItem('userName');
                        userToken = null;
                        userName = null;
                    }
                    updateUI();
                    return null; 
                }

                if(payload.action !== 'search_student') showAlert('تمت العملية بنجاح (عبر الخادم)!', 'success');
                return data;
            } else {
                showAlert('حدث خطأ في الاتصال بالسيرفر.', 'error');
            }
        } catch (error) {
            console.error('Error:', error);
            showAlert('فشل الاتصال بـ n8n.', 'error');
        }
    }

    async function submitForm(event, actionType) {
        event.preventDefault();
        
        if (actionType === 'add_student' && !adminToken) {
            if (!ensureUserName()) return;
            const pass = prompt('عملية الإضافة تتطلب صلاحيات مشرف.\nالرجاء إدخال الرقم السري للمشرف:');
            if (!pass) return;
            adminToken = pass;
            sessionStorage.setItem('adminToken', pass);
            updateUI();
        }

        const form = event.target;
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        // تعيين اسم الجدول الموحد لكل العمليات
        data.target_table = 'students';

        if(data.grade && data.section && data.track) {
            data.full_class_name = `${data.grade} / ${data.section} ${data.track}`;
        }
        if(data.new_grade) {
            data.new_full_class_name = `${data.new_grade} / ${data.new_section} ${data.new_track}`;
        }
        if(data.old_grade) {
            data.old_full_class_name = `${data.old_grade} / ${data.old_section} ${data.old_track}`;
        }
        if(data.target_grade) {
            data.target_full_class_name = `${data.target_grade} / ${data.target_section} ${data.target_track}`;
        }

        const payload = { action: actionType, data: data };

        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = 'جاري التنفيذ...';
        btn.disabled = true;

        const response = await sendRequestToN8n(payload);

        btn.innerText = originalText;
        btn.disabled = false;
        
        if (response) {
            if (actionType !== 'update_student') {
                showAlert('تمت العملية بنجاح (الوضع التجريبي)', 'success');
                form.reset();
            } else {
                showAlert('تم تحديث بيانات الطالب بنجاح (الوضع التجريبي)', 'success');
                document.getElementById('searchResultArea').style.display = 'none';
            }
        }
    }

    async function searchStudent(event) {
        event.preventDefault();
        const query = document.getElementById('searchQuery').value;
        const payload = { action: 'search_student', data: { query: query, target_table: 'students' } };
        
        const btn = event.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = 'جاري...';
        btn.disabled = true;

        const responseData = await sendRequestToN8n(payload);
        
        btn.innerText = originalText;
        btn.disabled = false;

        if(responseData && responseData.id && responseData.name) {
            document.getElementById('edit_original_id').value = responseData.id;
            document.getElementById('edit_name').value = responseData.name;
            document.getElementById('edit_id').value = responseData.id;
            
            if(responseData.gender) {
                document.getElementById('edit_gender').value = responseData.gender;
            }
            
            document.getElementById('searchResultArea').style.display = 'block';
            showAlert('تم العثور على بيانات الطالب بنجاح', 'success');
        } else if (responseData) {
            showAlert('لم يتم العثور على بيانات مطابقة', 'error');
            document.getElementById('searchResultArea').style.display = 'none';
        }
    }

    async function deleteStudent() {
        if (!adminToken) {
            if (!ensureUserName()) return;
            const pass = prompt('عملية الحذف تتطلب صلاحيات مشرف.\nالرجاء إدخال الرقم السري للمشرف:');
            if (!pass) return;
            adminToken = pass;
            sessionStorage.setItem('adminToken', pass);
            updateUI();
        }

        if(confirm('تحذير: هل أنت متأكد من حذف هذا الطالب بشكل نهائي؟')) {
            const studentId = document.getElementById('edit_original_id').value;
            
            const response = await sendRequestToN8n({ 
                action: 'delete_student', 
                data: { student_id: studentId, target_table: 'students' } 
            });
            
            if(response) {
                showAlert('تم حذف الطالب بنجاح (الوضع التجريبي)', 'success');
                document.getElementById('searchResultArea').style.display = 'none';
                document.getElementById('searchQuery').value = '';
            }
        }
    }

    function showAlert(message, type) {
        const alertEl = document.getElementById('mainAlert');
        alertEl.innerText = message;
        alertEl.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
        alertEl.style.display = 'block';
        setTimeout(hideAlert, 5000);
    }

    function hideAlert() { document.getElementById('mainAlert').style.display = 'none'; }
</script>

</body>
</html>
